name: pages

# Site code comes from main (site/). Benchmark data comes from the bench-results
# branch (data/). Both are assembled into one static artifact.
# Started by hand only (fleet standard CI-COST-01): benchmark.yml dispatches it
# after a publish; dispatch it yourself after a site/ change lands on main.
# Fleet standard: outside the taxonomy (fleet.yml exception WF-FILE-02).
on:
  workflow_dispatch:

# Nothing by default; each job declares its own permissions below.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_BRANCH: bench-results
  # Path of the data folder on the data branch. Single constant; keep in sync with site/config.js.
  DATA_PATH: data

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main (site code)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Check out bench-results (data), if the branch exists
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 = branch absent (empty state). Any other failure fails the build instead of deploying a wrong empty site.
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DATA_BRANCH}" --jq .name 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "HTTP 404"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No ${DATA_BRANCH} branch yet: building the empty state."
          else
            echo "::error::cannot look up ${DATA_BRANCH}: $out"; exit 1
          fi

      - name: Fetch data branch
        if: steps.probe.outputs.exists == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: _data
          persist-credentials: false

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          cp -R site/. _site/
          mkdir -p _site/data
          if [ -d "_data/${DATA_PATH}" ]; then
            # Only JSON files are published, nothing else from the data branch.
            find "_data/${DATA_PATH}" -name '*.json' -type f -print0 | while IFS= read -r -d '' f; do
              rel="${f#_data/"${DATA_PATH}"/}"
              jq -e 'type=="object"' "$f" >/dev/null || { echo "::warning::skipping invalid JSON $rel"; continue; }
              mkdir -p "_site/data/$(dirname "$rel")"
              cp "$f" "_site/data/$rel"
            done
          fi
          # index.json: a committed data/index.json (written by bench:publish / benchmark.yml)
          # always wins. The jq generation is only a fallback for legacy harness pushes
          # that carry runs/ without an index.
          if [ ! -f _site/data/index.json ]; then
            if ls _site/data/runs/*.json >/dev/null 2>&1; then
              jq -s '{runs: (. | sort_by([.date, (.run_id // "")]))}' _site/data/runs/*.json > _site/data/index.json
            else
              echo '{"runs":[]}' > _site/data/index.json
            fi
          fi
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
          retention-days: 1

  # No `environment: github-pages`: the fleet standard allows only its own environment
  # names (WF-NAME-06), and deploy-pages needs only pages + id-token.
  publish-pages:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
