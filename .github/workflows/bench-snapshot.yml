name: bench-snapshot

# Keeps a copy of the last published benchmark run in the repository
# (benchmarks/latest/), next to the code it measured. The last run is the
# newest run of each kind on the newest publish date, the same rule the
# benchmark site uses for "Run N". Source: the bench-results branch, written
# by bench:publish and benchmark.yml. The change lands as a PR, never as a
# direct push to main. It starts by hand only: benchmark.yml dispatches it after
# a publish; after a local `pnpm run bench:publish`, dispatch it yourself (the fleet
# standard allows push triggers on develop, stage and main only, CI-COST-19).
# Fleet standard: outside the taxonomy (fleet.yml exception WF-FILE-02).
on:
  workflow_dispatch:

# Nothing by default; the job declares its own permissions below.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: bench-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the chore/bench-snapshot branch
      pull-requests: write # open or update the snapshot PR
    steps:
      # The bench-results fetch and create-pull-request use the checkout credentials.
      - name: Check out main # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Read the bench-results data
        run: |
          set -euo pipefail
          git fetch --depth 1 origin bench-results
          mkdir -p "$RUNNER_TEMP/bench"
          git archive FETCH_HEAD data | tar -x -C "$RUNNER_TEMP/bench"

      # No dependency install, so no package cache to restore (fleet.yml exception CI-COST-14).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Copy the last run into benchmarks/latest/
        run: node scripts/bench/snapshot.mjs "$RUNNER_TEMP/bench/data" benchmarks/latest

      - name: Open or update the snapshot PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/bench-snapshot
          add-paths: |
            benchmarks/latest/
          commit-message: 'chore(bench): copy the last benchmark run into benchmarks/latest'
          title: 'chore(bench): snapshot of the last benchmark run'
          body: |
            Automated copy of the last published benchmark run from the `bench-results` branch
            into `benchmarks/latest/` (newest run of each kind on the newest publish date).
            `manifest.json` lists the runs. The numbers are unchanged copies; the site shows the
            same run: https://velimirmueller.github.io/code-context-mcp/
