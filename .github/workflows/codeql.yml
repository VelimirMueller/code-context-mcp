name: CodeQL

# Advanced setup (#311). Replaces the repository's default setup, which ran on
# every push and pull request. Turn default setup off after this merges:
#   gh api -X PATCH repos/VelimirMueller/code-context-mcp/code-scanning/default-setup -f state=not-configured

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default; the job gets only what the SARIF upload needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      # Pinned by commit SHA:
      #   actions/checkout      v6.1.0 = d23441a48e516b6c34aea4fa41551a30e30af803
      #   github/codeql-action  v4.39.1 = 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: default
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
