name: sync-skills

# Re-vendors vendor/skills/ from the plugin repo's main and opens or updates the
# chore/sync-skills PR. Started by hand only: the fleet standard has no schedules
# (CI-COST-12). Fleet standard: outside the taxonomy (fleet.yml exception WF-FILE-02).
on:
  workflow_dispatch:

# Nothing by default; the one job gets only what create-pull-request needs.
permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: sync-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the chore/sync-skills branch
      pull-requests: write # open or update the sync PR
    steps:
      # Pinned by commit SHA:
      #   actions/checkout                 v6.1.0 = d23441a48e516b6c34aea4fa41551a30e30af803
      #   actions/setup-node               v6.1.0 = 395ad3262231945c25e8478fd5baf05154b1d79f
      #   peter-evans/create-pull-request  v8.1.1 = 5f6978faf089d4d20b00c7766989d076bb2fc7f1
      # create-pull-request pushes the sync branch with the checkout credentials.
      - name: Check out the source # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No dependency install, so no package cache to restore (fleet.yml exception CI-COST-14).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Vendor the skills from upstream main and recompile the defaults
        run: |
          node scripts/sync-skills.mjs
          node scripts/compile-skills.mjs
      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-skills
          add-paths: |
            vendor/skills/
            src/scrum/frontend-skill-defaults.generated.ts
          commit-message: 'chore(skills): sync vendored skills from upstream main'
          title: 'chore(skills): sync from claude_development_skills'
          body: |
            Automated sync of the vendored `vendor/skills/` tree from the plugin repo's `main`,
            plus the regenerated `src/scrum/frontend-skill-defaults.generated.ts` that seeds the
            project DB. Source commit is recorded in `vendor/skills/.source.json`. Review the diff before merging.
