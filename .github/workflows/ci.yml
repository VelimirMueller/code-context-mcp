# Fleet standard ci.yml (library tier, public). Stages call VelimirMueller/fleet-workflows at v0.0.2.
name: ci

on:
  pull_request:
    # Only develop and main (fleet standard CI-COST-19, no exception). The old release/**
    # and integration/** targets had no branch and no open PR on 2026-10-28.
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

# On pull_request events github.event.number is the PR number (webhook payload `number`).
concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        # Template logic: `every` makes a file count as code when it matches all the negations
        # (no .md, not in docs/ …). One such file in a mixed PR sets code=true.
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: node
      # ESLint and Prettier instead of Biome. The repo is not formatted as a whole yet (#191), so
      # Prettier checks only the files this change touches. A pull_request run checks out the
      # merge commit refs/pull/N/merge, so HEAD^1 is the base branch tip and HEAD^1...HEAD is
      # the PR diff. The checkout is shallow (depth 1), so deepen it by one first. A dispatch
      # run checks the last commit of the branch.
      command: |
        pnpm run lint
        git fetch --no-tags --quiet --deepen=1 origin "$(git rev-parse HEAD)"
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git rev-parse --verify -q 'HEAD^2' >/dev/null; then
          echo "::error::expected the PR merge commit; HEAD^1 would not be the base"; exit 1
        fi
        pnpm run format:changed HEAD^1
        pnpm exec tsc --noEmit
        pnpm run typecheck:dashboard
        pnpm run check:dashboard-reachable
        pnpm run check:commands
        sh scripts/check-defaults.sh

  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    # Published npm package (engines node >=22): the oldest supported Node and the default
    # (fleet.yml exception CI-COST-09).
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.2
    with:
      stack: node
      tool-version: ${{ matrix.node }}
      # Keep equal to coverage.thresholds.lines in vitest.config.ts (fleet.yml exception CI-UNIT-03).
      coverage-floor: 62
      # The root suite with coverage, then the dashboard frontend suite.
      command: |
        pnpm exec vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
        pnpm run test:frontend --coverage

  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.2
    with:
      stack: node
      # The specs drive the built dashboard; playwright.config.ts has no projects.
      command: |
        pnpm run build
        pnpm exec playwright test --reporter=list,junit

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.2
    with:
      stack: node
      # Build, dist token check (#247), pack dry run, and the VitePress docs build that fails
      # on dead links (#264).
      command: |
        pnpm run build
        pnpm run check:dist-token
        mkdir -p "$RUNNER_TEMP/pack"
        pnpm pack --pack-destination "$RUNNER_TEMP/pack"
        pnpm --dir docs install --frozen-lockfile
        pnpm --dir docs run build

  conclusion:
    needs: [changes, lint, unit, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Template logic: a skipped stage passes only when no code changed (CODE false). With
      # CODE true, lint, unit and build must each be success; skipped fails.
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
