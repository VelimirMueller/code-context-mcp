name: CI

on:
  push:
    # develop: every change enters there (branch promotion develop → main).
    # No integration/** or release/** here: those branches are PR targets and
    # their PRs already run CI on the same commit (a push run would double it).
    branches: [main, develop]
  pull_request:
    # release/** too: a major lands on its release branch first (#179).
    # integration/** too: slice PRs land on an integration branch first (#293).
    branches: [main, develop, 'release/**', 'integration/**']
    # No labeled/unlabeled: a label run would cancel the full run in the same
    # concurrency group. The label-sensitive contract gate lives in contract.yml.
    types: [opened, synchronize, reopened]

# A new push to a PR supersedes the old run. Push runs on main/develop are never
# cancelled: the promotion flow needs a finished result for every SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job; no job writes to the repository.
permissions:
  contents: read

# Actions are pinned by commit SHA (same pins as benchmark.yml / pages.yml):
#   actions/checkout    v6.1.0 = d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-node  v6.1.0 = 395ad3262231945c25e8478fd5baf05154b1d79f
#   pnpm/action-setup   v6.1.0 = ea17c68df8912ef543352723c149a84f56e3d413
# pnpm/action-setup reads the pnpm version from packageManager in package.json
# and must run before setup-node, which needs pnpm on PATH for cache: pnpm.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 = minimum (package.json engines), 24 = recommended LTS.
        node-version: [22, 24, 'lts/*']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:commands
      - run: pnpm exec tsc --noEmit
      # The root tsconfig does not include the dashboard app (#213).
      - run: pnpm run typecheck:dashboard
      - run: pnpm test
      - run: pnpm run test:frontend
      - run: pnpm run build
      # Dist assets must not carry the dashboard token (#247).
      - run: pnpm run check:dist-token

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # format:changed diffs against the base commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ESLint (fails on errors, warnings are reported)
        run: pnpm run lint
      # Every dashboard module must be reached from src/main.tsx (#223).
      - name: No unreachable dashboard modules
        run: pnpm run check:dashboard-reachable
      - name: Prettier on the files this change touches
        env:
          # PR: the base branch commit. Push: the commit before the push.
          # SHAs reach the shell through env only, never ${{ }} in run.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          case "$base" in
            ''|0000000000000000000000000000000000000000) base="HEAD~1" ;;
          esac
          pnpm run format:changed "$base"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Playwright specs (seeded dashboard on a throwaway DB)
        run: pnpm run test:e2e

  validate-counts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Validate agent count
        run: |
          AGENT_COUNT=$(grep -A 100 "export const AGENT_DEFAULTS" src/scrum/defaults.ts | grep -E "^\s+role:" | wc -l)
          if [ "$AGENT_COUNT" -ne 9 ]; then
            echo "Error: Expected 9 agents, found $AGENT_COUNT"
            exit 1
          fi
          echo "Agent count validation passed: $AGENT_COUNT agents"
      - name: Validate skill count
        run: |
          SKILL_COUNT=$(grep -A 100 "export const SKILL_DEFAULTS" src/scrum/defaults.ts | grep -E "^\s+name:" | wc -l)
          if [ "$SKILL_COUNT" -ne 5 ]; then
            echo "Error: Expected 5 skills, found $SKILL_COUNT"
            exit 1
          fi
          echo "Skill count validation passed: $SKILL_COUNT skills"
      - name: Validate vendored skills
        run: |
          if [ ! -d vendor/skills ]; then
            echo "Error: vendored vendor/skills/ directory is missing"
            exit 1
          fi
          MANIFEST_COUNT=$(node -p "require('./vendor/skills/.source.json').skillCount")
          ACTUAL_COUNT=$(find vendor/skills -name SKILL.md | wc -l | tr -d ' ')
          if [ "$MANIFEST_COUNT" -ne "$ACTUAL_COUNT" ]; then
            echo "Error: vendor/skills/.source.json skillCount=$MANIFEST_COUNT but found $ACTUAL_COUNT SKILL.md files"
            exit 1
          fi
          echo "Vendored skills validation passed: $ACTUAL_COUNT skills"

  # VitePress build; catches dead links (#264). Runs only when the PR touches docs/.
  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the docs-changed check diffs against the base commit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Did this pull request touch docs/?
        id: docs-changed
        env:
          # SHAs reach the shell through env only, never ${{ }} in run.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE}"
          case "$base" in
            ''|0000000000000000000000000000000000000000) base="origin/main" ;;
          esac
          if git diff --name-only "${base}...HEAD" -- docs/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No docs/ file changed; docs build skipped."
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.docs-changed.outputs.changed == 'true'
        working-directory: docs
      - name: VitePress build (fails on dead links)
        run: pnpm run build
        if: steps.docs-changed.outputs.changed == 'true'
        working-directory: docs
