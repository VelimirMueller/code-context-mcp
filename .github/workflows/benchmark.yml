name: Benchmark

# On-demand benchmarks only — never a schedule (test/bench-guard.test.ts).
# kind=simulated runs the token-cost simulation. kind=agent runs a real
# OpenCode session against the fixture (glm or deepseek) ONLY when the matching
# API key secret is set. The repo keeps no provider secrets on purpose, so in
# the default setup agent runs skip here (green, nothing published) and run
# locally instead: `pnpm run bench:live`, then `pnpm run bench:publish`.
#
# Two jobs, separated so the untrusted agent code never shares a runner with
# publish credentials:
#   - run:     contents: read only, checkout without persisted credentials,
#              agent secrets scoped to the single agent step. Uploads the run
#              JSON as an artifact.
#   - publish: contents: write + actions: write, downloads the artifact,
#              commits data/ to bench-results and dispatches pages.yml. It
#              never runs agent code and never sees provider secrets.
#
# Injection rule: workflow inputs (and step outputs) are NEVER interpolated
# into `run:` scripts with ${{ … }} — they reach the shell only through
# `env:` and are validated against an allowlist before use.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which benchmark to run
        type: choice
        options: [simulated, agent]
        default: simulated
      provider:
        description: Agent provider (kind=agent only)
        type: choice
        options: [glm, deepseek]
        default: glm

# Nothing by default; each job declares its own permissions below.
permissions: {}

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - name: Validate inputs against the allowlist
        env:
          BENCH_KIND: ${{ inputs.kind }}
          BENCH_PROVIDER: ${{ inputs.provider }}
        run: |
          case "$BENCH_KIND" in
            simulated|agent) ;;
            *) echo "::error::unsupported kind '$BENCH_KIND' (allowlist: simulated|agent)"; exit 1 ;;
          esac
          case "$BENCH_PROVIDER" in
            glm|deepseek) ;;
            *) echo "::error::unsupported provider '$BENCH_PROVIDER' (allowlist: glm|deepseek)"; exit 1 ;;
          esac

      - name: Check out main (no persisted credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pinned by commit SHA (also in the publish job):
      #   pnpm/action-setup  v6.1.0 = ea17c68df8912ef543352723c149a84f56e3d413
      # It reads the pnpm version from packageManager in package.json and runs
      # before setup-node, which needs pnpm on PATH for cache: pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Run simulated benchmark
        if: inputs.kind == 'simulated'
        id: simulated
        run: |
          pnpm run bench
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Run agent benchmark (clean skip without the key secret)
        if: inputs.kind == 'agent'
        id: agent
        shell: bash
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BENCH_PROVIDER: ${{ inputs.provider }}
        run: |
          case "$BENCH_PROVIDER" in
            glm)      KEY_NAME=ZAI_API_KEY ;;
            deepseek) KEY_NAME=DEEPSEEK_API_KEY ;;
            *)        echo "::error::unsupported provider '$BENCH_PROVIDER' (allowlist: glm|deepseek)"; exit 1 ;;
          esac
          if [ -z "${!KEY_NAME}" ]; then
            echo "::notice::no $KEY_NAME secret — agent benchmark skipped. Run it locally: pnpm run build && pnpm run bench:live --provider $BENCH_PROVIDER, then pnpm run bench:publish (BENCHMARK-GUIDE.md)"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm run bench:live --provider "$BENCH_PROVIDER"
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: decide
        env:
          BENCH_KIND: ${{ inputs.kind }}
          AGENT_RAN: ${{ steps.agent.outputs.ran }}
        run: |
          if [ "$BENCH_KIND" = "simulated" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$AGENT_RAN" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Artifact actions pinned by SHA. Verified 2026-10-10 with
      # `git ls-remote --tags https://github.com/actions/<repo>`:
      #   upload-artifact   v7.0.1 = 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (runs: node24)
      #   download-artifact v8.0.1 = 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (runs: node24)
      # v4 ran on Node 20, which GitHub deprecated. Both releases are older than 2 weeks.
      - name: Upload run data
        if: steps.decide.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-data
          path: data/runs
          if-no-files-found: error

  publish:
    needs: run
    if: needs.run.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main (persisted credentials for push)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download run data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-data
          path: data/runs

      - name: Publish run data to bench-results
        run: pnpm run bench:publish

      - name: Rebuild the Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
