name: visual-gate

# The baseline gate (#293) reads the `visual-change` label, so label events re-run
# it. It is its own workflow, like contract.yml, so a label run never cancels the
# full CI run. The pixel comparison itself stays in ci.yml (job `visual`).
# Fleet standard: a label gate outside the taxonomy (fleet.yml exception WF-FILE-02).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: visual-gate-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A PR that adds, changes or deletes a baseline under test/visual/__snapshots__/
  # needs the label `visual-change` (scripts/check-visual-change.mjs).
  visual-label:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the gate diffs the baselines against the base commit
      # No dependency install, so no package cache to restore (fleet.yml exception CI-COST-14).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Baselines change only with the visual-change label
        # Base commit and labels come from $GITHUB_EVENT_PATH.
        run: node scripts/check-visual-change.mjs
